name: 2026.2.15 Windows Gradle prewarm
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  prewarm:
    name: Prepare exact-tag Windows Gradle cache
    runs-on: windows-2022
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: 8a75c1a6ae46630a67eb209da06136502fe10607
      REUSE_RUN_ID: 42036443481
    steps:
      - name: Set isolated Gradle home
        shell: bash
        run: echo "GRADLE_USER_HOME=$(cygpath -w "$RUNNER_TEMP/meco-gradle-home")" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8a75c1a6ae46630a67eb209da06136502fe10607
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: build/release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify immutable tagged source and build plugin cache
        shell: bash
        run: |
          python build/release-tools/scripts/verify_2026_2_15_recovery_v2.py
          python build/release-tools/scripts/recovery_windows_deadline.py
          ./gradlew help -Ptoolchain-optional-roboRio --no-daemon
          python build/release-tools/scripts/recovery_windows_deadline.py
      - name: Archive isolated Gradle cache
        shell: python
        run: |
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['GRADLE_USER_HOME'])
          with zipfile.ZipFile('gradle-cache.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=1) as archive:
              for part in ('caches', 'permwrapper'):
                  for path in (root / part).rglob('*'):
                      if path.is_file() and not path.name.endswith('.lock'):
                          archive.write(path, path.relative_to(root).as_posix())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-gradle-cache-2026-2-15
          path: gradle-cache.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Enforce prewarm deadline
        run: python build/release-tools/scripts/recovery_windows_deadline.py
