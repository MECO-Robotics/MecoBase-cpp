name: Stage patched PathPlanner candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the validated candidate after the consumer matrix passes
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - '.github/workflows/pathplanner-candidate.yml'
      - 'packaging/pathplanner/**'
      - 'scripts/vendor_consumer_smoke.py'
      - 'scripts/preserve_published_maven.py'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mjansen4857/pathplanner
          ref: e02bbf3176588166e8fe5192ab8dea85f6d62f7a
          path: build/pathplanner-source
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5
        if: runner.os == 'Windows'
      - name: Pin and patch upstream source
        run: python packaging/pathplanner/prepare_source.py build/pathplanner-source
      - name: Install roboRIO toolchain
        if: runner.os == 'Linux'
        run: ./gradlew installRoboRioToolchain
      - name: Build Linux and roboRIO archives and run regression
        if: runner.os == 'Linux'
        working-directory: build/pathplanner-source/pathplannerlib
        run: >-
          ./gradlew cppHeadersZip
          _GROUP_com_pathplanner_lib_ID_PathplannerLib-cpp_CLS-linuxathenastatic
          _GROUP_com_pathplanner_lib_ID_PathplannerLib-cpp_CLS-linuxathenastaticdebug
          _GROUP_com_pathplanner_lib_ID_PathplannerLib-cpp_CLS-linuxx86-64static
          _GROUP_com_pathplanner_lib_ID_PathplannerLib-cpp_CLS-linuxx86-64staticdebug
          runPathplannerLibTestLinuxx86-64DebugGoogleTestExe --max-workers=2
      - name: Build Windows archives
        if: runner.os == 'Windows'
        working-directory: build/pathplanner-source/pathplannerlib
        shell: cmd
        run: >-
          gradlew.bat
          _GROUP_com_pathplanner_lib_ID_PathplannerLib-cpp_CLS-windowsx86-64static
          _GROUP_com_pathplanner_lib_ID_PathplannerLib-cpp_CLS-windowsx86-64staticdebug
          -Ptoolchain-optional-roboRio --max-workers=2
      - name: Include upstream license
        if: runner.os == 'Linux'
        run: cp build/pathplanner-source/pathplannerlib/LICENSE build/pathplanner-source/pathplannerlib/build/outputs/PathPlanner-LICENSE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pathplanner-${{ matrix.platform }}-${{ github.sha }}
          path: |
            build/pathplanner-source/pathplannerlib/build/outputs/*.zip
            build/pathplanner-source/pathplannerlib/build/outputs/PathPlanner-LICENSE.txt
          if-no-files-found: error

  stage:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pathplanner-*-${{ github.sha }}
          path: build/pathplanner-outputs
          merge-multiple: true
      - name: Prepare candidate site and retain published coordinates
        run: python3 packaging/pathplanner/stage_site.py build/pathplanner-outputs build/candidate-site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pathplanner-candidate-site-${{ github.sha }}
          path: build/candidate-site/
          if-no-files-found: error

  consumer:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: roborio, configuration: Debug}
          - {os: ubuntu-24.04, target: roborio, configuration: Release}
          - {os: ubuntu-24.04, target: desktop, configuration: Debug}
          - {os: ubuntu-24.04, target: desktop, configuration: Release}
          - {os: windows-2022, target: desktop, configuration: Debug}
          - {os: windows-2022, target: desktop, configuration: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5
        if: runner.os == 'Windows'
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - name: Prepare pinned Studica Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache
          echo "FRC_VENDOR_CACHE=$(cygpath -w "$PWD/build/vendor-cache")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pathplanner-candidate-site-${{ github.sha }}
          path: build/candidate-site/
      - name: Link clean candidate consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }} --configuration ${{ matrix.configuration }}
          --descriptor build/candidate-site/PathplannerCandidate.json
          --maven-repo build/candidate-site/maven

  deploy:
    # Dispatch only after the workflow has been reviewed and merged to main.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: consumer
    runs-on: ubuntu-24.04
    concurrency:
      group: meco-base-pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pathplanner-candidate-site-${{ github.sha }}
          path: build/candidate-site/
      - name: Preserve current site and add the exact validated candidate
        run: >-
          python3 packaging/pathplanner/prepare_deployment.py
          --candidate build/candidate-site --destination build/deployment-site
          --site-url https://meco-robotics.github.io/MecoBase-cpp
      - name: Save deployed snapshot for later consumer checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pathplanner-deployed-snapshot-${{ github.sha }}
          path: |
            build/deployment-site/MecoBase.json
            build/deployment-site/SHA256SUMS.json
          if-no-files-found: error
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/deployment-site/
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
      - name: Verify exact deployed snapshot and preserved coordinates
        run: >-
          python3 packaging/pathplanner/verify_deployment.py
          --expected build/deployment-site --site-url '${{ steps.deployment.outputs.page_url }}'

  deployed-consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: roborio, configuration: Debug}
          - {os: ubuntu-24.04, target: roborio, configuration: Release}
          - {os: ubuntu-24.04, target: desktop, configuration: Debug}
          - {os: ubuntu-24.04, target: desktop, configuration: Release}
          - {os: windows-2022, target: desktop, configuration: Debug}
          - {os: windows-2022, target: desktop, configuration: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5
        if: runner.os == 'Windows'
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - name: Prepare pinned Studica Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache
          echo "FRC_VENDOR_CACHE=$(cygpath -w "$PWD/build/vendor-cache")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pathplanner-deployed-snapshot-${{ github.sha }}
          path: build/deployed-snapshot/
      - name: Create deployed consumer descriptor
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          source = Path('build/deployed-snapshot/MecoBase.json')
          data = json.loads(source.read_text())
          next(d for d in data['cppDependencies'] if d['artifactId'] == 'PathplannerLib-cpp')['version'] = '2026.1.2-meco1'
          Path('build/deployed-snapshot/PathplannerCandidate.json').write_text(json.dumps(data))
          PYTHON
      - name: Link against deployed candidate
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }} --configuration ${{ matrix.configuration }}
          --descriptor build/deployed-snapshot/PathplannerCandidate.json
          --maven-repo https://meco-robotics.github.io/MecoBase-cpp/maven
