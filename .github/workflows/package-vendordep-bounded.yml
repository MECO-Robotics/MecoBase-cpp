name: Bounded MECO Base release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable release tag to package, for example v2026.2.12
        type: string
        required: true
      publish:
        description: Publish this package to GitHub Pages after review
        type: boolean
        required: true
        default: false
      reuse_run_id:
        description: Verified archive run to reuse for the 2026.2.12 recovery only
        type: string
        required: false
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-vendor-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify release tag matches descriptor
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: python3 scripts/release_guard.py tag --ref "refs/tags/$RELEASE_REF"
      - name: Prepare pinned Studica artifacts
        run: python scripts/prepare_vendor_cache.py --output build/vendor-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
          if-no-files-found: error

  build-linux:
    if: inputs.reuse_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: linuxathena, configuration: Debug, lower: debug, task: frcBaseLinuxathenaDebugStaticLibrary}
          - {arch: linuxathena, configuration: Release, lower: release, task: frcBaseLinuxathenaReleaseStaticLibrary}
          - {arch: linuxx86-64, configuration: Debug, lower: debug, task: frcBaseLinuxx86-64DebugStaticLibrary}
          - {arch: linuxx86-64, configuration: Release, lower: release, task: frcBaseLinuxx86-64ReleaseStaticLibrary}
    name: Build ${{ matrix.arch }} ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install roboRIO toolchain
        if: matrix.arch == 'linuxathena'
        run: ./gradlew installRoboRioToolchain
      - name: Build static archive
        run: ./gradlew ${{ matrix.task }} -Ptoolchain-optional-roboRio --max-workers=4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meco-base-${{ matrix.arch }}-${{ matrix.lower }}
          path: build/libs/frcBase/static/${{ matrix.arch }}/${{ matrix.lower }}/
          if-no-files-found: error

  build-windows:
    if: inputs.reuse_run_id == ''
    needs: prepare-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {configuration: Debug, lower: debug, task: frcBaseWindowsx86-64DebugStaticLibrary}
          - {configuration: Release, lower: release, task: frcBaseWindowsx86-64ReleaseStaticLibrary}
    name: Build Windows ${{ matrix.configuration }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYTHON'
          import os, pathlib
          cache = pathlib.Path('build/vendor-cache').resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FRC_VENDOR_CACHE={cache}\n')
          PYTHON
      - name: Build static archive
        shell: bash
        run: >-
          ./gradlew ${{ matrix.task }}
          -Ptoolchain-optional-roboRio --max-workers=4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meco-base-windowsx86-64-${{ matrix.lower }}
          path: build/libs/frcBase/static/windowsx86-64/${{ matrix.lower }}/
          if-no-files-found: error

  collect-linux:
    needs: build-linux
    if: always() && (needs.build-linux.result == 'success' || inputs.reuse_run_id != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: inputs.reuse_run_id != ''
        with:
          ref: ${{ github.sha }}
          path: build/release-tools
      - name: Verify immutable recovery run and artifact digests
        if: inputs.reuse_run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: python3 build/release-tools/scripts/verify_release_artifact_reuse.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.reuse_run_id != ''
        with:
          name: vendor-platform-linux
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: build/libs/frcBase/static/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.reuse_run_id != ''
        with:
          name: vendor-provenance-linux
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: build/provenance/
      - name: Verify reused Linux provenance
        if: inputs.reuse_run_id != ''
        run: python3 scripts/release_guard.py verify --platform linux --file build/provenance/linux.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.reuse_run_id == ''
        with:
          name: meco-base-linuxathena-debug
          path: build/libs/frcBase/static/linuxathena/debug/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.reuse_run_id == ''
        with:
          name: meco-base-linuxathena-release
          path: build/libs/frcBase/static/linuxathena/release/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.reuse_run_id == ''
        with:
          name: meco-base-linuxx86-64-debug
          path: build/libs/frcBase/static/linuxx86-64/debug/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.reuse_run_id == ''
        with:
          name: meco-base-linuxx86-64-release
          path: build/libs/frcBase/static/linuxx86-64/release/
      - name: Record Linux archive provenance
        run: python scripts/release_guard.py record --platform linux --file build/provenance/linux.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor-provenance-linux
          path: build/provenance/linux.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor-platform-linux
          path: |
            build/libs/frcBase/static/linuxathena/
            build/libs/frcBase/static/linuxx86-64/
          if-no-files-found: error

  collect-windows:
    needs: build-windows
    if: always() && (needs.build-windows.result == 'success' || inputs.reuse_run_id != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: inputs.reuse_run_id != ''
        with:
          ref: ${{ github.sha }}
          path: build/release-tools
      - name: Verify immutable recovery run and artifact digests
        if: inputs.reuse_run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: python3 build/release-tools/scripts/verify_release_artifact_reuse.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meco-base-windowsx86-64-debug
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: build/libs/frcBase/static/windowsx86-64/debug/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meco-base-windowsx86-64-release
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: build/libs/frcBase/static/windowsx86-64/release/
      - name: Record Windows archive provenance
        run: python scripts/release_guard.py record --platform windows --file build/provenance/windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor-provenance-windows
          path: build/provenance/windows.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor-platform-windows
          path: build/libs/frcBase/static/windowsx86-64/
          if-no-files-found: error

  assemble-repository:
    needs: [collect-linux, collect-windows]
    if: always() && needs.collect-linux.result == 'success' && needs.collect-windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vendor-platform-linux
          path: build/libs/frcBase/static/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vendor-platform-windows
          path: build/libs/frcBase/static/windowsx86-64/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vendor-provenance-*
          path: build/provenance/
          merge-multiple: true
      - name: Verify staged archive provenance
        run: |
          python3 scripts/release_guard.py verify --platform linux --file build/provenance/linux.json
          python3 scripts/release_guard.py verify --platform windows --file build/provenance/windows.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble Maven repository
        run: ./gradlew packageVendorMaven -Ptoolchain-optional-roboRio --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meco-base-vendordep-${{ github.run_id }}
          path: build/vendor-maven/
          if-no-files-found: error

  consumer-smoke:
    needs: [assemble-repository, prepare-vendor-cache]
    if: always() && needs.assemble-repository.result == 'success' && needs.prepare-vendor-cache.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: roborio
            configuration: Debug
          - os: ubuntu-24.04
            target: desktop
            configuration: Debug
          - os: windows-2022
            target: desktop
            configuration: Debug
          - os: ubuntu-24.04
            target: roborio
            configuration: Release
          - os: ubuntu-24.04
            target: desktop
            configuration: Release
          - os: windows-2022
            target: desktop
            configuration: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows'
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYTHON'
          import os, pathlib
          cache = pathlib.Path('build/vendor-cache').resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FRC_VENDOR_CACHE={cache}\n')
          PYTHON
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meco-base-vendordep-${{ github.run_id }}
          path: build/vendor-maven/
      - name: Link clean consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }}
          --configuration ${{ matrix.configuration }}
          --maven-repo build/vendor-maven/maven

  publish-pages:
    concurrency:
      group: meco-base-pages-publication
      cancel-in-progress: false
    if: always() && inputs.publish && startsWith(inputs.release_ref, 'v') && needs.consumer-smoke.result == 'success'
    needs: consumer-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meco-base-vendordep-${{ github.run_id }}
          path: build/vendor-maven/
      - name: Preserve published Maven coordinates
        run: >-
          python3 scripts/preserve_published_maven.py
          --site-url https://meco-robotics.github.io/MecoBase-cpp
          --repository build/vendor-maven
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/vendor-maven/
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify deployed descriptor and Maven artifacts
        run: python3 scripts/verify_deployed_vendordep.py --site-url '${{ steps.deployment.outputs.page_url }}'

  deployed-consumer-smoke:
    if: always() && inputs.publish && startsWith(inputs.release_ref, 'v') && needs.collect-linux.result == 'success' && needs.collect-windows.result == 'success' && needs.prepare-vendor-cache.result == 'success' && needs.publish-pages.result == 'success'
    needs: [collect-linux, collect-windows, prepare-vendor-cache, publish-pages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: roborio, configuration: Debug}
          - {os: ubuntu-24.04, target: roborio, configuration: Release}
          - {os: ubuntu-24.04, target: desktop, configuration: Debug}
          - {os: ubuntu-24.04, target: desktop, configuration: Release}
          - {os: windows-2022, target: desktop, configuration: Debug}
          - {os: windows-2022, target: desktop, configuration: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows'
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
      - name: Configure verified Windows vendor cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYTHON'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PYTHON
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - name: Link deployed consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }}
          --configuration ${{ matrix.configuration }}
          --maven-repo https://meco-robotics.github.io/MecoBase-cpp/maven
