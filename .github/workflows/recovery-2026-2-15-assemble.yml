name: 2026.2.15 bounded Windows assembly
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Windows configuration
        type: choice
        required: true
        options: [Debug, Release]
      shard_run_id:
        description: Completed run with all sixteen successful exact-source shards
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  assemble:
    name: Assemble verified Windows ${{ inputs.configuration }} shards
    runs-on: windows-2022
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: 8a75c1a6ae46630a67eb209da06136502fe10607
      REUSE_RUN_ID: 42036443481
      CONFIGURATION: ${{ inputs.configuration }}
      SHARD_RUN_ID: ${{ inputs.shard_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8a75c1a6ae46630a67eb209da06136502fe10607
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: build/release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5
      - name: Verify tagged source and bounded shard run
        run: |
          python build/release-tools/scripts/verify_2026_2_15_recovery_v2.py
          python build/release-tools/scripts/recovery_windows_deadline.py
          python build/release-tools/scripts/recovery_fetch_previous_shards.py
      - name: Verify complete tagged source coverage and assemble
        shell: bash
        run: |
          python build/release-tools/scripts/recovery_windows_deadline.py
          python build/release-tools/scripts/2026_2_15_recovery_windows_objects_v2.py assemble \
            --shards build/recovery-shards --output build/recovery-archive/frcBase.lib --configuration "$CONFIGURATION"
          python build/release-tools/scripts/recovery_write_assembly_provenance.py
          python build/release-tools/scripts/recovery_windows_deadline.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-windows-assembly-${{ inputs.configuration }}
          path: build/recovery-archive/
          if-no-files-found: error
          retention-days: 1
      - name: Enforce queue plus execution deadline
        run: python build/release-tools/scripts/recovery_windows_deadline.py
