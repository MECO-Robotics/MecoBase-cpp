name: 2026.2.14 bounded Windows recovery
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build exactly one Windows configuration per run
        type: choice
        required: true
        options: [Debug, Release]
permissions:
  actions: read
  contents: read

jobs:
  recovery-windows-shard:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    name: Recovery Windows ${{ matrix.configuration }} shard ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        configuration: ["${{ inputs.configuration }}"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v2026.2.14
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: build/release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: studica-windows-maven-2026.0.0
          run-id: 42036443481
          github-token: ${{ github.token }}
          path: build/vendor-cache/
      - name: Verify recovery source and vendor inputs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: 42036443481
        run: |
          python build/release-tools/scripts/verify_2026_2_14_recovery.py
          python build/release-tools/scripts/recovery_windows_deadline.py
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          echo "FRC_VENDOR_CACHE=$(cygpath -w "$PWD/build/vendor-cache")" >> "$GITHUB_ENV"
      - name: Compile exact-tag shard
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          SHARD: ${{ matrix.shard }}
        run: |
          task="compileFrcBaseWindowsx86-64${CONFIGURATION}StaticLibraryFrcBaseCpp"
          ./gradlew -I build/release-tools/scripts/recovery_debug_embedded_symbols.gradle "$task" -PcacheWarmShard="$((SHARD % 4))" -Ptoolchain-optional-roboRio --max-workers=4
          lower="$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
          python build/release-tools/scripts/2026_2_14_recovery_windows_objects.py record --shard "$SHARD" \
            --objects "build/objs/frcBase/static/windowsx86-64/$lower/frcBaseCpp" \
            --options "build/tmp/$task/options.txt" --dest build/recovery-objects --configuration "$CONFIGURATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-windows-${{ matrix.configuration }}-${{ matrix.shard }}
          path: build/recovery-objects/
          if-no-files-found: error
          retention-days: 1
      - name: Enforce Windows total deadline
        run: python build/release-tools/scripts/recovery_windows_deadline.py

  recovery-windows-archive:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    name: Assemble recovery Windows ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - {configuration: "${{ inputs.configuration }}", lower: "${{ inputs.configuration == 'Debug' && 'debug' || 'release' }}"}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v2026.2.14
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: build/release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - name: Download and verify completed shard artifacts
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: python build/release-tools/scripts/recovery_fetch_windows_shards.py
      - name: Validate source coverage and assemble archive
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          LOWER: ${{ matrix.lower }}
        run: |
          python build/release-tools/scripts/recovery_windows_deadline.py
          python build/release-tools/scripts/2026_2_14_recovery_windows_objects.py assemble \
            --shards build/recovery-shards --output "build/libs/frcBase/static/windowsx86-64/$LOWER/frcBase.lib" --configuration "$CONFIGURATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meco-base-windowsx86-64-${{ matrix.lower }}
          path: build/libs/frcBase/static/windowsx86-64/${{ matrix.lower }}/
          if-no-files-found: error
      - name: Enforce Windows total deadline
        run: python build/release-tools/scripts/recovery_windows_deadline.py

