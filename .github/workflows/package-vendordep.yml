name: Package MECO Base vendordep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-vendordep.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'vendor/**'
      - 'LICENSE.md'
      - 'scripts/prepare_vendor_cache.py'
      - 'scripts/vendor-cache-sha256.json'
      - 'scripts/vendor_consumer_smoke.py'
      - 'scripts/finalize_vendordep.py'
      - 'scripts/verify_deployed_vendordep.py'
      - 'scripts/**'
      - 'src/main/cpp/base/**'
      - 'src/main/include/base/**'
      - 'src/test/cpp/**'
      - 'vendordeps/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/package-vendordep.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'vendor/**'
      - 'LICENSE.md'
      - 'scripts/prepare_vendor_cache.py'
      - 'scripts/vendor-cache-sha256.json'
      - 'scripts/vendor_consumer_smoke.py'
      - 'scripts/finalize_vendordep.py'
      - 'scripts/verify_deployed_vendordep.py'
      - 'scripts/**'
      - 'src/main/cpp/base/**'
      - 'src/main/include/base/**'
      - 'src/test/cpp/**'
      - 'vendordeps/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this package to GitHub Pages after review
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Run desktop Debug tests
        run: >-
          ./gradlew runMecoBaseTestLinuxx86-64DebugGoogleTestExe
          -Ptoolchain-optional-roboRio --max-workers=2

  build-linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install roboRIO toolchain
        run: ./gradlew installRoboRioToolchain
      - name: Build roboRIO and Linux archives
        run: |
          for attempt in 1 2 3; do
            if ./gradlew \
              frcBaseLinuxathenaDebugStaticLibrary \
              frcBaseLinuxathenaReleaseStaticLibrary \
              frcBaseLinuxx86-64DebugStaticLibrary \
              frcBaseLinuxx86-64ReleaseStaticLibrary \
              mecoBaseTestLinuxx86-64DebugGoogleTestExe \
              mecoBaseTestLinuxx86-64ReleaseGoogleTestExe \
              --max-workers=2; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 15
          done
      - name: Prepare pinned Studica artifacts
        run: python scripts/prepare_vendor_cache.py --output build/vendor-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor-platform-linux
          path: |
            build/libs/frcBase/static/linuxathena/
            build/libs/frcBase/static/linuxx86-64/
          if-no-files-found: error

  build-windows:
    needs: build-linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYTHON'
          import os, pathlib
          cache = pathlib.Path('build/vendor-cache').resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FRC_VENDOR_CACHE={cache}\n')
          PYTHON
      - name: Build Windows archives
        shell: bash
        run: >-
          ./gradlew
          frcBaseWindowsx86-64DebugStaticLibrary
          frcBaseWindowsx86-64ReleaseStaticLibrary
          mecoBaseTestWindowsx86-64DebugGoogleTestExe
          mecoBaseTestWindowsx86-64ReleaseGoogleTestExe
          -Ptoolchain-optional-roboRio --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor-platform-windows
          path: |
            build/libs/frcBase/static/windowsx86-64/
          if-no-files-found: error

  assemble-repository:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vendor-platform-linux
          path: build/libs/frcBase/static/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vendor-platform-windows
          path: build/libs/frcBase/static/windowsx86-64/
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble Maven repository
        run: ./gradlew packageVendorMaven -Ptoolchain-optional-roboRio --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meco-base-vendordep-${{ github.sha }}
          path: build/vendor-maven/
          if-no-files-found: error

  consumer-smoke:
    needs: assemble-repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: roborio
            configuration: Debug
          - os: ubuntu-24.04
            target: desktop
            configuration: Debug
          - os: windows-2022
            target: desktop
            configuration: Debug
          - os: ubuntu-24.04
            target: roborio
            configuration: Release
          - os: ubuntu-24.04
            target: desktop
            configuration: Release
          - os: windows-2022
            target: desktop
            configuration: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows'
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYTHON'
          import os, pathlib
          cache = pathlib.Path('build/vendor-cache').resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FRC_VENDOR_CACHE={cache}\n')
          PYTHON
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meco-base-vendordep-${{ github.sha }}
          path: build/vendor-maven/
      - name: Link clean consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }}
          --configuration ${{ matrix.configuration }}
          --maven-repo build/vendor-maven/maven

  publish-pages:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: consumer-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meco-base-vendordep-${{ github.sha }}
          path: build/vendor-maven/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/vendor-maven/
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify deployed descriptor and Maven artifacts
        run: python3 scripts/verify_deployed_vendordep.py --site-url '${{ steps.deployment.outputs.page_url }}'
