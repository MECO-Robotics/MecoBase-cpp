name: Test MECO Base

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/package-vendordep.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'vendor/**'
      - 'LICENSE.md'
      - 'scripts/prepare_vendor_cache.py'
      - 'scripts/vendor-cache-sha256.json'
      - 'scripts/vendor_consumer_smoke.py'
      - 'scripts/finalize_vendordep.py'
      - 'scripts/verify_deployed_vendordep.py'
      - 'scripts/**'
      - 'src/main/cpp/base/**'
      - 'src/main/include/base/**'
      - 'src/test/cpp/**'
      - 'vendordeps/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-pr-gradle:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Download and verify Gradle 8.11
        run: |
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --retry-delay 1 \
            --connect-timeout 5 --max-time 35 \
            https://services.gradle.org/distributions/gradle-8.11-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.11-bin.zip"
          echo '57dafb5c2622c6cc08b993c85b7c06956a2f53536432a30ead46166dbca0f1e9  '"$RUNNER_TEMP/gradle-8.11-bin.zip" | sha256sum --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-8.11-bin
          path: ${{ runner.temp }}/gradle-8.11-bin.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  prepare-pr-vendor-cache:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download and verify Studica desktop artifacts
        run: python3 scripts/prepare_vendor_cache.py --manifest scripts/vendor-cache-linux-sha256.json --output build/pr-vendor-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studica-linux-maven-2026.0.0
          path: build/pr-vendor-cache/
          if-no-files-found: error
          retention-days: 1

  # Each shard compiles a disjoint subset with the same flags as the full
  # test build. The unsharded test job below remains the sole test result.
  warm-desktop-compiler-cache:
    needs: [prepare-pr-vendor-cache, prepare-pr-gradle]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gradle-8.11-bin
          path: ${{ runner.temp }}/meco-gradle/
      - name: Verify and install Gradle 8.11
        run: |
          echo '57dafb5c2622c6cc08b993c85b7c06956a2f53536432a30ead46166dbca0f1e9  '"$RUNNER_TEMP/meco-gradle/gradle-8.11-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/meco-gradle/gradle-8.11-bin.zip" -d "$RUNNER_TEMP/meco-gradle"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: studica-linux-maven-2026.0.0
          path: build/pr-vendor-cache/
      - name: Verify Studica desktop artifacts
        run: |
          python3 scripts/prepare_vendor_cache.py --manifest scripts/vendor-cache-linux-sha256.json --output build/pr-vendor-cache --verify-only
          echo "FRC_VENDOR_CACHE=$PWD/build/pr-vendor-cache" >> "$GITHUB_ENV"
      - name: Install compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          mkdir -p "$RUNNER_TEMP/meco-compiler"
          ln -s "$(command -v ccache)" "$RUNNER_TEMP/meco-compiler/g++"
          ln -s "$(command -v ccache)" "$RUNNER_TEMP/meco-compiler/gcc"
          echo "$RUNNER_TEMP/meco-compiler" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/meco-ccache" >> "$GITHUB_ENV"
      - name: Compile cache shard (not a test result)
        env:
          CACHE_SHARD: ${{ matrix.shard }}
        run: |
          timeout --signal=INT --kill-after=5s 130s "$RUNNER_TEMP/meco-gradle/gradle-8.11/bin/gradle" \
            compileMecoBaseTestLinuxx86-64DebugGoogleTestExeFrcBaseCpp \
            compileMecoBaseTestLinuxx86-64DebugGoogleTestExeMecoBaseTestCpp \
            -Ptoolchain-optional-roboRio -PcacheWarmShard="$CACHE_SHARD" -PcacheWarmShardCount=8 --max-workers=4
          ccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meco-desktop-ccache-${{ matrix.shard }}
          path: ${{ runner.temp }}/meco-ccache/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  desktop-test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: warm-desktop-compiler-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gradle-8.11-bin
          path: ${{ runner.temp }}/meco-gradle/
      - name: Verify and install Gradle 8.11
        run: |
          echo '57dafb5c2622c6cc08b993c85b7c06956a2f53536432a30ead46166dbca0f1e9  '"$RUNNER_TEMP/meco-gradle/gradle-8.11-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/meco-gradle/gradle-8.11-bin.zip" -d "$RUNNER_TEMP/meco-gradle"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: studica-linux-maven-2026.0.0
          path: build/pr-vendor-cache/
      - name: Verify Studica desktop artifacts
        run: |
          python3 scripts/prepare_vendor_cache.py --manifest scripts/vendor-cache-linux-sha256.json --output build/pr-vendor-cache --verify-only
          echo "FRC_VENDOR_CACHE=$PWD/build/pr-vendor-cache" >> "$GITHUB_ENV"
      - name: Install compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          mkdir -p "$RUNNER_TEMP/meco-compiler"
          ln -s "$(command -v ccache)" "$RUNNER_TEMP/meco-compiler/g++"
          ln -s "$(command -v ccache)" "$RUNNER_TEMP/meco-compiler/gcc"
          echo "$RUNNER_TEMP/meco-compiler" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/meco-ccache" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: meco-desktop-ccache-*
          path: ${{ runner.temp }}/meco-cache-shards
      - name: Combine compiler cache shards
        run: |
          mkdir -p "$CCACHE_DIR"
          for index in 0 1 2 3 4 5 6 7; do
            shard="$RUNNER_TEMP/meco-cache-shards/meco-desktop-ccache-$index"
            test -d "$shard"
            cp -an "$shard/." "$CCACHE_DIR/"
          done
      - name: Test publishing helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Run desktop Debug tests
        run: >-
          "$RUNNER_TEMP/meco-gradle/gradle-8.11/bin/gradle" runMecoBaseTestLinuxx86-64DebugGoogleTestExe
          -Ptoolchain-optional-roboRio --max-workers=4
