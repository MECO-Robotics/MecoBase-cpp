name: Package MECO Base vendordep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-vendordep.yml'
      - 'build.gradle'
      - 'vendor/**'
      - 'scripts/prepare_vendor_cache.py'
      - 'scripts/vendor-cache-sha256.json'
      - 'scripts/vendor_consumer_smoke.py'
      - 'README.md'
      - 'docs/replay.md'
      - 'src/main/cpp/base/**'
      - 'src/main/cpp/modules/**'
      - 'src/main/include/base/**'
      - 'simulation/**'
      - 'vendordeps/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/package-vendordep.yml'
      - 'build.gradle'
      - 'vendor/**'
      - 'scripts/prepare_vendor_cache.py'
      - 'scripts/vendor-cache-sha256.json'
      - 'scripts/vendor_consumer_smoke.py'
      - 'README.md'
      - 'docs/replay.md'
      - 'src/main/cpp/base/**'
      - 'src/main/cpp/modules/**'
      - 'src/main/include/base/**'
      - 'simulation/**'
      - 'vendordeps/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this package to GitHub Pages after review
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: lukka/get-cmake@latest
      - name: Install roboRIO toolchain
        run: ./gradlew installRoboRioToolchain
      - name: Build roboRIO and Linux archives
        run: >-
          ./gradlew
          frcBaseLinuxathenaDebugStaticLibrary
          frcBaseLinuxathenaReleaseStaticLibrary
          frcBaseLinuxx86-64DebugStaticLibrary
          frcBaseLinuxx86-64ReleaseStaticLibrary
          mecoBaseTestLinuxx86-64DebugGoogleTestExe
          mecoBaseTestLinuxx86-64ReleaseGoogleTestExe
          buildJoltDebug buildJoltRelease --max-workers=2
      - name: Run desktop unit tests
        run: |
          ./gradlew runMecoBaseTestLinuxx86-64DebugGoogleTestExe --max-workers=1
          ./gradlew runMecoBaseTestLinuxx86-64ReleaseGoogleTestExe --max-workers=1
      - name: Prepare pinned Studica artifacts
        run: python scripts/prepare_vendor_cache.py --output build/vendor-cache
      - uses: actions/upload-artifact@v4
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-platform-linux
          path: |
            build/libs/frcBase/static/linuxathena/
            build/libs/frcBase/static/linuxx86-64/
            build/jolt/
          if-no-files-found: error

  build-windows:
    needs: build-linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - uses: actions/download-artifact@v4
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYTHON'
          import os, pathlib
          cache = pathlib.Path('build/vendor-cache').resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FRC_VENDOR_CACHE={cache}\n')
          PYTHON
      - name: Build Windows archives
        shell: bash
        run: >-
          ./gradlew
          frcBaseWindowsx86-64DebugStaticLibrary
          frcBaseWindowsx86-64ReleaseStaticLibrary
          mecoBaseTestWindowsx86-64DebugGoogleTestExe
          mecoBaseTestWindowsx86-64ReleaseGoogleTestExe
          buildJoltDebug buildJoltRelease
          -Ptoolchain-optional-roboRio --max-workers=2
      - name: Run Windows desktop unit tests
        shell: bash
        run: |
          ./gradlew runMecoBaseTestWindowsx86-64DebugGoogleTestExe -Ptoolchain-optional-roboRio --max-workers=1
          ./gradlew runMecoBaseTestWindowsx86-64ReleaseGoogleTestExe -Ptoolchain-optional-roboRio --max-workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-platform-windows
          path: |
            build/libs/frcBase/static/windowsx86-64/
            build/jolt/
          if-no-files-found: error

  assemble-repository:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vendor-platform-*
          path: build/
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble Maven repository
        run: ./gradlew packageVendorMaven -Ptoolchain-optional-roboRio --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: meco-base-vendordep-${{ github.sha }}
          path: build/vendor-maven/
          if-no-files-found: error

  consumer-smoke:
    needs: assemble-repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: roborio
          - os: ubuntu-24.04
            target: desktop
          - os: windows-2022
            target: desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYTHON'
          import os, pathlib
          cache = pathlib.Path('build/vendor-cache').resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FRC_VENDOR_CACHE={cache}\n')
          PYTHON
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - uses: actions/download-artifact@v4
        with:
          name: meco-base-vendordep-${{ github.sha }}
          path: build/vendor-maven/
      - name: Link clean consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }}
          --maven-repo build/vendor-maven/maven

  publish-pages:
    if: inputs.publish
    needs: consumer-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meco-base-vendordep-${{ github.sha }}
          path: build/vendor-maven/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/vendor-maven/
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
