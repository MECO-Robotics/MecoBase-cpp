name: Publish tagged MECO Base vendordep

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable MecoBase release tag, for example v2026.2.11
        required: true
        type: string
      publish:
        description: Deploy the tested package to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: meco-base-tagged-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare-windows-vendor-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - name: Validate tagged release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/release_guard.py tag --ref "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare verified Studica artifacts
        run: |
          python3 scripts/prepare_vendor_cache.py --output build/vendor-cache
          python3 - <<'PYCODE'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          root = pathlib.Path('build/vendor-cache')
          entries = json.loads(pathlib.Path('scripts/vendor-cache-sha256.json').read_text())['artifacts']
          hashes = {
              'Studica-cpp-2026.0.0-linuxathenastatic.zip': '8024ee13f20fdbb59c8edcef8a0cc9dda05a8ba85d0888b6d437ea489809dcf2',
              'Studica-cpp-2026.0.0-linuxathenastaticdebug.zip': '938fa1f94c916e5ffb8895569f6fe54b5f4d88fe3ce7a2f56213fe9f9e087f00',
              'Studica-cpp-2026.0.0-linuxx86-64static.zip': '15cadaa53b0bc61444b6dbeab27a873242d416a9e22c41607dcf656b3824a844',
              'Studica-cpp-2026.0.0-linuxx86-64staticdebug.zip': 'a182dd09bf0aad2a25be273a2f7ab7a7f0f1e7183458221e64fedb7d96715d09',
              'Studica-driver-2026.0.0-linuxathenastatic.zip': '54c70c9ae4184e34378c389c97c09b87ef03e131f4262fb3cc0e463f222bc100',
              'Studica-driver-2026.0.0-linuxathenastaticdebug.zip': '291f4c54a7f47859edb48e3c9e913965504ef2f9e343aef07e1ad0083a2456be',
              'Studica-driver-2026.0.0-linuxx86-64static.zip': 'c37f83689f4bc90d7198a4c37fd2d798a287b6db2de0aafc391bf6b6e0389385',
              'Studica-driver-2026.0.0-linuxx86-64staticdebug.zip': '4b35372a9e502b681abe05d1bd75c0603689cf52e27e5623ddf38c9c24e9a801',
          }
          for name, expected in hashes.items():
              artifact = name.split('-2026.0.0-', 1)[0]
              relative = f'com/studica/frc/{artifact}/2026.0.0/{name}'
              url = f'https://dev.studica.com/maven/release/2026/{relative}'
              with urllib.request.urlopen(url, timeout=15) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise ValueError(f'Studica checksum mismatch: {name}')
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  if not archive.namelist() or archive.testzip() is not None:
                      raise ValueError(f'Invalid Studica archive: {name}')
              destination = root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              entries.append({'path': relative, 'sha256': expected})
          (root / 'tagged-sha256sums.txt').write_text(
              ''.join(f"{entry['sha256']}  {entry['path']}\n" for entry in entries))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
          if-no-files-found: error

  # A warmup saves compiler outputs; the separate test job remains required.
  warm-linux-test-cache:
    needs: prepare-windows-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: mecoBaseTestLinuxx86-64DebugGoogleTestExe}
          - {task: mecoBaseTestLinuxx86-64ReleaseGoogleTestExe}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
      - name: Verify cached Studica artifacts
        run: |
          (cd build/vendor-cache && sha256sum -c tagged-sha256sums.txt)
          echo "FRC_VENDOR_CACHE=$GITHUB_WORKSPACE/build/vendor-cache" >> "$GITHUB_ENV"
      - name: Install compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          mkdir -p "$RUNNER_TEMP/meco-compiler"
          ln -s "$(command -v ccache)" "$RUNNER_TEMP/meco-compiler/g++"
          ln -s "$(command -v ccache)" "$RUNNER_TEMP/meco-compiler/gcc"
          echo "$RUNNER_TEMP/meco-compiler" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/meco-ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/meco-ccache
          key: tagged-test-${{ inputs.release_tag }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tagged-test-${{ inputs.release_tag }}-${{ matrix.task }}-
      - name: Warm compiler cache (not a test result)
        env:
          BUILD_TASK: ${{ matrix.task }}
        run: |
          set +e
          timeout --signal=INT --kill-after=5s 110s ./gradlew "$BUILD_TASK" \
            -Ptoolchain-optional-roboRio --max-workers=4
          result=$?
          set -e
          timeout 10s ./gradlew --stop || true
          ccache --show-stats
          if [[ "$result" != 0 && "$result" != 124 ]]; then exit "$result"; fi

  linux-archive:
    needs: prepare-windows-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linuxathena, variant: debug, task: frcBaseLinuxathenaDebugStaticLibrary}
          - {platform: linuxathena, variant: release, task: frcBaseLinuxathenaReleaseStaticLibrary}
          - {platform: linuxx86-64, variant: debug, task: frcBaseLinuxx86-64DebugStaticLibrary}
          - {platform: linuxx86-64, variant: release, task: frcBaseLinuxx86-64ReleaseStaticLibrary}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - name: Validate tagged release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/release_guard.py tag --ref "refs/tags/$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
      - name: Verify cached Studica artifacts
        shell: bash
        run: |
          (cd build/vendor-cache && sha256sum -c tagged-sha256sums.txt)
          echo "FRC_VENDOR_CACHE=$GITHUB_WORKSPACE/build/vendor-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install roboRIO toolchain
        if: matrix.platform == 'linuxathena'
        run: ./gradlew installRoboRioToolchain
      - name: Build archive
        env:
          BUILD_TASK: ${{ matrix.task }}
        run: ./gradlew "$BUILD_TASK" -Ptoolchain-optional-roboRio --max-workers=4
      - name: Record archive provenance
        env:
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          platform, variant = os.environ['PLATFORM'], os.environ['VARIANT']
          relative = f'{platform}/{variant}/libfrcBase.a'
          archive = pathlib.Path('build/libs/frcBase/static') / relative
          data = {'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'archive': relative, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
          out = pathlib.Path('build/provenance') / f'{platform}-{variant}.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-archive-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            build/libs/frcBase/static/${{ matrix.platform }}/${{ matrix.variant }}/libfrcBase.a
            build/provenance/${{ matrix.platform }}-${{ matrix.variant }}.json
          if-no-files-found: error

  # Compile a completed subset so later Windows jobs can reuse Gradle's
  # incremental state without treating a partial compile as a test result.
  warm-windows-build-cache:
    needs: prepare-windows-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: frcBaseWindowsx86-64DebugStaticLibrary, warm_base: compileFrcBaseWindowsx86-64DebugStaticLibraryFrcBaseCpp, warm_test: ''}
          - {task: frcBaseWindowsx86-64ReleaseStaticLibrary, warm_base: compileFrcBaseWindowsx86-64ReleaseStaticLibraryFrcBaseCpp, warm_test: ''}
          - {task: mecoBaseTestWindowsx86-64DebugGoogleTestExe, warm_base: compileMecoBaseTestWindowsx86-64DebugGoogleTestExeFrcBaseCpp, warm_test: compileMecoBaseTestWindowsx86-64DebugGoogleTestExeMecoBaseTestCpp}
          - {task: mecoBaseTestWindowsx86-64ReleaseGoogleTestExe, warm_base: compileMecoBaseTestWindowsx86-64ReleaseGoogleTestExeFrcBaseCpp, warm_test: compileMecoBaseTestWindowsx86-64ReleaseGoogleTestExeMecoBaseTestCpp}
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .gradle/
            build/
          key: tagged-windows${{ startsWith(matrix.task, 'mecoBaseTest') && '-test-v2' || '' }}-${{ inputs.release_tag }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tagged-windows${{ startsWith(matrix.task, 'mecoBaseTest') && '-test-v2' || '' }}-${{ inputs.release_tag }}-${{ matrix.task }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYCODE'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PYCODE
      - name: Build a completed source subset (not a test result)
        env:
          WARM_BASE: ${{ matrix.warm_base }}
          WARM_TEST: ${{ matrix.warm_test }}
        shell: bash
        run: |
          stage=1
          if [[ -f .gradle/meco-prewarm-stage ]]; then
            read -r previous < .gradle/meco-prewarm-stage
            [[ "$previous" =~ ^[1-5]$ ]]
            stage=$((previous + 1))
            if [[ -n "$WARM_TEST" && "$stage" -gt 5 ]]; then stage=5; fi
            if [[ -z "$WARM_TEST" && "$stage" -gt 2 ]]; then stage=2; fi
          fi
          export MECO_PREWARM_STAGE="$stage"
          export MECO_PREWARM_PARTS=3
          if [[ -n "$WARM_TEST" ]]; then export MECO_PREWARM_PARTS=6; fi
          cat > "$RUNNER_TEMP/meco-prewarm.gradle" <<'GRADLE'
          gradle.taskGraph.whenReady { graph ->
              graph.allTasks.findAll { it instanceof org.gradle.language.cpp.tasks.CppCompile }.each { task ->
                  def allSources = task.source.files.findAll { it.isFile() }.sort { a, b -> a.path <=> b.path }
                  def parts = System.getenv('MECO_PREWARM_PARTS').toInteger()
                  def count = (allSources.size() * System.getenv('MECO_PREWARM_STAGE').toInteger() + parts - 1).intdiv(parts)
                  task.source.setFrom(allSources.take(count))
                  println "PREWARM ${task.name} ${count}/${allSources.size()}"
              }
          }
          GRADLE
          tasks=("$WARM_BASE")
          if [[ -n "$WARM_TEST" ]]; then tasks+=("$WARM_TEST"); fi
          ./gradlew --no-daemon -I "$RUNNER_TEMP/meco-prewarm.gradle" "${tasks[@]}" \
            -Ptoolchain-optional-roboRio --max-workers=4
          printf '%s\n' "$stage" > .gradle/meco-prewarm-stage

  windows-archive:
    needs: prepare-windows-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windowsx86-64, variant: debug, task: frcBaseWindowsx86-64DebugStaticLibrary}
          - {platform: windowsx86-64, variant: release, task: frcBaseWindowsx86-64ReleaseStaticLibrary}
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate tagged release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python scripts/release_guard.py tag --ref "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .gradle/
            build/
          key: tagged-windows${{ startsWith(matrix.task, 'mecoBaseTest') && '-test-v2' || '' }}-${{ inputs.release_tag }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tagged-windows${{ startsWith(matrix.task, 'mecoBaseTest') && '-test-v2' || '' }}-${{ inputs.release_tag }}-${{ matrix.task }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PY'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PY
      - name: Build archive
        env:
          BUILD_TASK: ${{ matrix.task }}
        shell: bash
        run: ./gradlew "$BUILD_TASK" -Ptoolchain-optional-roboRio --max-workers=4
      - name: Record archive provenance
        env:
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          platform, variant = os.environ['PLATFORM'], os.environ['VARIANT']
          relative = f'{platform}/{variant}/frcBase.lib'
          archive = pathlib.Path('build/libs/frcBase/static') / relative
          data = {'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'archive': relative, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
          out = pathlib.Path('build/provenance') / f'{platform}-{variant}.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-archive-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            build/libs/frcBase/static/${{ matrix.platform }}/${{ matrix.variant }}/frcBase.lib
            build/provenance/${{ matrix.platform }}-${{ matrix.variant }}.json
          if-no-files-found: error

  linux-test-build:
    needs: prepare-windows-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: mecoBaseTestLinuxx86-64DebugGoogleTestExe}
          - {task: mecoBaseTestLinuxx86-64ReleaseGoogleTestExe}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
      - name: Verify cached Studica artifacts
        shell: bash
        run: |
          (cd build/vendor-cache && sha256sum -c tagged-sha256sums.txt)
          echo "FRC_VENDOR_CACHE=$GITHUB_WORKSPACE/build/vendor-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          mkdir -p "$RUNNER_TEMP/meco-compiler"
          ln -s "$(command -v ccache)" "$RUNNER_TEMP/meco-compiler/g++"
          ln -s "$(command -v ccache)" "$RUNNER_TEMP/meco-compiler/gcc"
          echo "$RUNNER_TEMP/meco-compiler" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/meco-ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/meco-ccache
          key: tagged-test-${{ inputs.release_tag }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tagged-test-${{ inputs.release_tag }}-${{ matrix.task }}-
      - name: Build test executable
        env:
          BUILD_TASK: ${{ matrix.task }}
        run: ./gradlew "$BUILD_TASK" -Ptoolchain-optional-roboRio --max-workers=4

  windows-test-build:
    needs: prepare-windows-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: mecoBaseTestWindowsx86-64DebugGoogleTestExe}
          - {task: mecoBaseTestWindowsx86-64ReleaseGoogleTestExe}
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .gradle/
            build/
          key: tagged-windows${{ startsWith(matrix.task, 'mecoBaseTest') && '-test-v2' || '' }}-${{ inputs.release_tag }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tagged-windows${{ startsWith(matrix.task, 'mecoBaseTest') && '-test-v2' || '' }}-${{ inputs.release_tag }}-${{ matrix.task }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYCODE'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PYCODE
      - name: Build test executable
        env:
          BUILD_TASK: ${{ matrix.task }}
        shell: bash
        run: ./gradlew "$BUILD_TASK" -Ptoolchain-optional-roboRio --max-workers=4

  assemble-repository:
    needs: [linux-archive, windows-archive, linux-test-build, windows-test-build, warm-linux-test-cache, warm-windows-build-cache]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tagged-archive-*
          path: build/
          merge-multiple: true
      - name: Verify archive provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          root = pathlib.Path('build/libs/frcBase/static')
          for platform in ('linuxathena', 'linuxx86-64', 'windowsx86-64'):
              for variant in ('debug', 'release'):
                  name = 'frcBase.lib' if platform.startswith('windows') else 'libfrcBase.a'
                  relative = f'{platform}/{variant}/{name}'
                  archive = root / relative
                  expected = {'sourceCommit': commit, 'archive': relative,
                              'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
                  actual = json.loads((pathlib.Path('build/provenance') / f'{platform}-{variant}.json').read_text())
                  if actual != expected:
                      raise SystemExit(f'Archive provenance mismatch: {relative}')
          PY
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble Maven repository
        run: ./gradlew packageVendorMaven -Ptoolchain-optional-roboRio --max-workers=4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-meco-base-vendordep
          path: build/vendor-maven/
          if-no-files-found: error

  consumer:
    needs: [assemble-repository, prepare-windows-vendor-cache]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: roborio, configuration: Debug}
          - {os: ubuntu-24.04, target: roborio, configuration: Release}
          - {os: ubuntu-24.04, target: desktop, configuration: Debug}
          - {os: ubuntu-24.04, target: desktop, configuration: Release}
          - {os: windows-2022, target: desktop, configuration: Debug}
          - {os: windows-2022, target: desktop, configuration: Release}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          (cd build/vendor-cache && sha256sum -c tagged-sha256sums.txt)
          python - <<'PY'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PY
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-meco-base-vendordep
          path: build/vendor-maven/
      - name: Link clean staged consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }}
          --configuration ${{ matrix.configuration }}
          --maven-repo build/vendor-maven/maven

  publish-pages:
    needs: consumer
    if: inputs.publish
    concurrency:
      group: meco-base-pages-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-meco-base-vendordep
          path: build/vendor-maven/
      - name: Preserve published Maven coordinates
        run: >-
          python3 scripts/preserve_published_maven.py
          --site-url https://meco-robotics.github.io/MecoBase-cpp
          --repository build/vendor-maven
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/vendor-maven/
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify deployed descriptor and Maven artifacts
        run: python3 scripts/verify_deployed_vendordep.py --site-url '${{ steps.deployment.outputs.page_url }}'

  deployed-consumer:
    if: inputs.publish
    needs: [publish-pages, prepare-windows-vendor-cache]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: roborio, configuration: Debug}
          - {os: ubuntu-24.04, target: roborio, configuration: Release}
          - {os: ubuntu-24.04, target: desktop, configuration: Debug}
          - {os: ubuntu-24.04, target: desktop, configuration: Release}
          - {os: windows-2022, target: desktop, configuration: Debug}
          - {os: windows-2022, target: desktop, configuration: Release}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-vendor-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          (cd build/vendor-cache && sha256sum -c tagged-sha256sums.txt)
          python - <<'PY'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PY
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - name: Link deployed consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }}
          --configuration ${{ matrix.configuration }}
          --maven-repo https://meco-robotics.github.io/MecoBase-cpp/maven
