name: Publish tagged MECO Base vendordep

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable MecoBase release tag, for example v2026.2.11
        required: true
        type: string
      publish:
        description: Deploy the tested package to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: meco-base-tagged-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare-windows-vendor-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - name: Validate tagged release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/release_guard.py tag --ref "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare verified Studica artifacts
        run: python3 scripts/prepare_vendor_cache.py --output build/vendor-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-studica-windows-maven
          path: build/vendor-cache/
          if-no-files-found: error

  linux-archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linuxathena, variant: debug, task: frcBaseLinuxathenaDebugStaticLibrary}
          - {platform: linuxathena, variant: release, task: frcBaseLinuxathenaReleaseStaticLibrary}
          - {platform: linuxx86-64, variant: debug, task: frcBaseLinuxx86-64DebugStaticLibrary}
          - {platform: linuxx86-64, variant: release, task: frcBaseLinuxx86-64ReleaseStaticLibrary}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - name: Validate tagged release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/release_guard.py tag --ref "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install roboRIO toolchain
        if: matrix.platform == 'linuxathena'
        run: ./gradlew installRoboRioToolchain
      - name: Build archive
        env:
          BUILD_TASK: ${{ matrix.task }}
        run: ./gradlew "$BUILD_TASK" -Ptoolchain-optional-roboRio --max-workers=4
      - name: Record archive provenance
        env:
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          platform, variant = os.environ['PLATFORM'], os.environ['VARIANT']
          relative = f'{platform}/{variant}/libfrcBase.a'
          archive = pathlib.Path('build/libs/frcBase/static') / relative
          data = {'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'archive': relative, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
          out = pathlib.Path('build/provenance') / f'{platform}-{variant}.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-archive-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            build/libs/frcBase/static/${{ matrix.platform }}/${{ matrix.variant }}/libfrcBase.a
            build/provenance/${{ matrix.platform }}-${{ matrix.variant }}.json
          if-no-files-found: error

  windows-archive:
    needs: prepare-windows-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windowsx86-64, variant: debug, task: frcBaseWindowsx86-64DebugStaticLibrary}
          - {platform: windowsx86-64, variant: release, task: frcBaseWindowsx86-64ReleaseStaticLibrary}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate tagged release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python scripts/release_guard.py tag --ref "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-windows-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PY'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PY
      - name: Build archive
        env:
          BUILD_TASK: ${{ matrix.task }}
        shell: bash
        run: ./gradlew "$BUILD_TASK" -Ptoolchain-optional-roboRio --max-workers=4
      - name: Record archive provenance
        env:
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          platform, variant = os.environ['PLATFORM'], os.environ['VARIANT']
          relative = f'{platform}/{variant}/frcBase.lib'
          archive = pathlib.Path('build/libs/frcBase/static') / relative
          data = {'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'archive': relative, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
          out = pathlib.Path('build/provenance') / f'{platform}-{variant}.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-archive-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            build/libs/frcBase/static/${{ matrix.platform }}/${{ matrix.variant }}/frcBase.lib
            build/provenance/${{ matrix.platform }}-${{ matrix.variant }}.json
          if-no-files-found: error

  linux-test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: mecoBaseTestLinuxx86-64DebugGoogleTestExe}
          - {task: mecoBaseTestLinuxx86-64ReleaseGoogleTestExe}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build test executable
        env:
          BUILD_TASK: ${{ matrix.task }}
        run: ./gradlew "$BUILD_TASK" -Ptoolchain-optional-roboRio --max-workers=4

  windows-test-build:
    needs: prepare-windows-vendor-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: mecoBaseTestWindowsx86-64DebugGoogleTestExe}
          - {task: mecoBaseTestWindowsx86-64ReleaseGoogleTestExe}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-studica-windows-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYCODE'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PYCODE
      - name: Build test executable
        env:
          BUILD_TASK: ${{ matrix.task }}
        shell: bash
        run: ./gradlew "$BUILD_TASK" -Ptoolchain-optional-roboRio --max-workers=4

  assemble-repository:
    needs: [linux-archive, windows-archive, linux-test-build, windows-test-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tagged-archive-*
          path: build/
          merge-multiple: true
      - name: Verify archive provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          root = pathlib.Path('build/libs/frcBase/static')
          for platform in ('linuxathena', 'linuxx86-64', 'windowsx86-64'):
              for variant in ('debug', 'release'):
                  name = 'frcBase.lib' if platform.startswith('windows') else 'libfrcBase.a'
                  relative = f'{platform}/{variant}/{name}'
                  archive = root / relative
                  expected = {'sourceCommit': commit, 'archive': relative,
                              'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
                  actual = json.loads((pathlib.Path('build/provenance') / f'{platform}-{variant}.json').read_text())
                  if actual != expected:
                      raise SystemExit(f'Archive provenance mismatch: {relative}')
          PY
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble Maven repository
        run: ./gradlew packageVendorMaven -Ptoolchain-optional-roboRio --max-workers=4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-meco-base-vendordep
          path: build/vendor-maven/
          if-no-files-found: error

  consumer:
    needs: [assemble-repository, prepare-windows-vendor-cache]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: roborio, configuration: Debug}
          - {os: ubuntu-24.04, target: roborio, configuration: Release}
          - {os: ubuntu-24.04, target: desktop, configuration: Debug}
          - {os: ubuntu-24.04, target: desktop, configuration: Release}
          - {os: windows-2022, target: desktop, configuration: Debug}
          - {os: windows-2022, target: desktop, configuration: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows'
        with:
          name: tagged-studica-windows-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PY'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PY
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-meco-base-vendordep
          path: build/vendor-maven/
      - name: Link clean staged consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }}
          --configuration ${{ matrix.configuration }}
          --maven-repo build/vendor-maven/maven

  publish-pages:
    needs: consumer
    if: inputs.publish
    concurrency:
      group: meco-base-pages-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-meco-base-vendordep
          path: build/vendor-maven/
      - name: Preserve published Maven coordinates
        run: >-
          python3 scripts/preserve_published_maven.py
          --site-url https://meco-robotics.github.io/MecoBase-cpp
          --repository build/vendor-maven
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/vendor-maven/
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify deployed descriptor and Maven artifacts
        run: python3 scripts/verify_deployed_vendordep.py --site-url '${{ steps.deployment.outputs.page_url }}'

  deployed-consumer:
    if: inputs.publish
    needs: [publish-pages, prepare-windows-vendor-cache]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: roborio, configuration: Debug}
          - {os: ubuntu-24.04, target: roborio, configuration: Release}
          - {os: ubuntu-24.04, target: desktop, configuration: Debug}
          - {os: ubuntu-24.04, target: desktop, configuration: Release}
          - {os: windows-2022, target: desktop, configuration: Debug}
          - {os: windows-2022, target: desktop, configuration: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows'
        with:
          name: tagged-studica-windows-maven
          path: build/vendor-cache/
      - name: Verify pinned Studica artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PY'
          import os, pathlib
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"FRC_VENDOR_CACHE={pathlib.Path('build/vendor-cache').resolve()}\n")
          PY
      - name: Install roboRIO toolchain
        if: matrix.target == 'roborio'
        run: ./gradlew installRoboRioToolchain
      - name: Link deployed consumer
        shell: bash
        run: >-
          python scripts/vendor_consumer_smoke.py
          --target ${{ matrix.target }}
          --configuration ${{ matrix.configuration }}
          --maven-repo https://meco-robotics.github.io/MecoBase-cpp/maven
