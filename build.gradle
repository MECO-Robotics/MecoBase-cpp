plugins {
    id "c"
    id "cpp"
    id "google-test-test-suite"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// CI transports these exact pinned vendor artifacts from a verified upstream
// download when the Windows runner cannot reach the vendor Maven host.
def vendorCache = providers.environmentVariable('FRC_VENDOR_CACHE').orNull
if (vendorCache) {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    url = uri(file(vendorCache))
                    metadataSources { mavenPom(); artifact() }
                }
            }
            filter { includeGroup('com.studica.frc') }
        }
    }
}

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// WPILib simulation remains available for Base's deterministic HAL tests.
wpi.cpp.debugSimulation = false

// Set the platform default so GradleRIO cannot append C++20 after our flag.
// The pinned roboRIO GCC 12 supports only a subset of C++23.
nativeUtils.platformConfigs.all {
    cppCompiler.args.removeAll { it.startsWith('-std=') || it.startsWith('/std:') }
    cppCompiler.args.add(name.startsWith('windows') ? '/std:c++latest' : '-std=c++23')
}

model {
    components {
        frcBase(NativeLibrarySpec) {
            targetPlatform wpi.platforms.roborio
            if (includeDesktopSupport) {
                targetPlatform wpi.platforms.desktop
            }

            sources.cpp {
                source {
                    srcDir 'src/main/cpp/base'
                    include '**/*.cpp', '**/*.cc'
                    srcDir 'src/main/cpp/modules'
                    include '**/*.cpp', '**/*.cc'
                }
                exportedHeaders {
                    srcDir 'src/main/include'
                    include 'base/**'
                }
            }

            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
        }

    }
    testSuites {
        mecoBaseTest(GoogleTestTestSuiteSpec) {
            testing $.components.frcBase

            sources.cpp {
                source {
                    srcDir 'src/test/cpp'
                    include '**/*.cpp'
                }
            }

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
            wpi.cpp.deps.googleTest(it)
        }
    }
}

model {
    binaries {
        all { binary ->
            def modulePlatform = binary.targetPlatform.name
            if (['linuxathena', 'linuxx86-64', 'windowsx86-64'].contains(modulePlatform)) {
                def moduleVariant = binary.buildType.name.equalsIgnoreCase('debug') ? 'debug' : 'release'
                def moduleDirectory = file("build/named-modules/${modulePlatform}/${moduleVariant}")
                if (modulePlatform.startsWith('windows')) {
                    binary.cppCompiler.args '/DMECO_USE_NAMED_MODULES=1',
                        "/ifcSearchDir${moduleDirectory.absolutePath}"
                } else {
                    binary.cppCompiler.args '-DMECO_USE_NAMED_MODULES=1', '-fmodules-ts',
                        "-fmodule-mapper=${new File(moduleDirectory, 'module-mapper.txt').absolutePath}"
                }
            }
        }
    }
}

// Create a local Maven repository suitable for WPILib's vendor JSON resolver.
// CI builds each target on its supported runner before this packaging task runs.
// Publish the simulation extraction under a new immutable coordinate. The
// already-published 2026.1.0 descriptor still contains Jolt artifacts.
def vendorVersion = '2026.2.0'
def vendorMavenDir = layout.buildDirectory.dir('vendor-maven')
tasks.register('packageVendorMaven') {
    outputs.dir(vendorMavenDir)
    doLast {
        def descriptorModel = new groovy.json.JsonSlurper().parse(file('vendor/MecoBase.json'))
        def expectedPlatforms = [
            'meco-base-cpp': ['linuxathena', 'linuxx86-64', 'windowsx86-64']
        ]
        if (descriptorModel.version != vendorVersion) {
            throw new GradleException("Vendordep version ${descriptorModel.version} does not match package version ${vendorVersion}")
        }
        expectedPlatforms.each { artifactId, platforms ->
            def dependency = descriptorModel.cppDependencies.find {
                it.groupId == 'com.mecorobotics.frc' && it.artifactId == artifactId
            }
            if (dependency == null || dependency.version != vendorVersion ||
                dependency.binaryPlatforms.sort() != platforms.sort()) {
                throw new GradleException("Vendordep coordinates/platforms drifted for ${artifactId}; expected ${vendorVersion} on ${platforms}")
            }
        }
        def root = vendorMavenDir.get().asFile
        delete(root)
        def descriptor = new File(root, 'MecoBase.json')
        descriptor.parentFile.mkdirs()
        descriptor.bytes = file('vendor/MecoBase.json').bytes
        copy {
            from file('LICENSE.md')
            into root
        }
        def mavenRoot = new File(root, 'maven')
        def artifacts = [
            [id: 'meco-base-cpp', lib: 'mecoBase', headers: true,
             sources: true,
             files: [
                 linuxathena: file("build/libs/frcBase/static/linuxathena"),
                 linuxx86_64: file("build/libs/frcBase/static/linuxx86-64"),
                 windowsx86_64: file("build/libs/frcBase/static/windowsx86-64")]]
        ]
        def platformPaths = [linuxathena: 'linux/athena', linuxx86_64: 'linux/x86-64', windowsx86_64: 'windows/x86-64']
        def missingArtifacts = []
        artifacts.each { artifact ->
            def dir = new File(mavenRoot, "com/mecorobotics/frc/${artifact.id}/${vendorVersion}")
            dir.mkdirs()
            def pom = """<?xml version=\"1.0\" encoding=\"UTF-8\"?>
<project xmlns=\"http://maven.apache.org/POM/4.0.0\"><modelVersion>4.0.0</modelVersion><groupId>com.mecorobotics.frc</groupId><artifactId>${artifact.id}</artifactId><version>${vendorVersion}</version><packaging>pom</packaging></project>
"""
            new File(dir, "${artifact.id}-${vendorVersion}.pom").text = pom
            ['linuxathena': 'linuxathena', 'linuxx86-64': 'linuxx86_64', 'windowsx86-64': 'windowsx86_64'].each { classifier, key ->
                def platformRoot = artifact.files[key]
                if (platformRoot == null) return
                ['debug': false, 'debugSuffix': true].each { variant, debug ->
                    def buildType = debug ? 'debug' : 'release'
                    def ext = classifier.startsWith('windows') ? '.lib' : '.a'
                    def baseFile = classifier.startsWith('windows') ? 'frcBase.lib' : 'libfrcBase.a'
                    def source = new File(platformRoot, "${buildType}/${baseFile}")
                    if (!source.isFile()) {
                        missingArtifacts << source
                        return
                    }
                    def suffix = debug ? 'staticdebug' : 'static'
                    def output = new File(dir, "${artifact.id}-${vendorVersion}-${classifier}${suffix}.zip")
                    def prefix = classifier.startsWith('windows') ? '' : 'lib'
                    def publishedName = "${prefix}${artifact.lib}${ext}"
                    ant.zip(destfile: output) {
                        zipfileset(file: source, fullpath: "${platformPaths[key]}/static/${publishedName}")
                        zipfileset(file: file('LICENSE.md'), fullpath: 'LICENSE.md')
                    }
                }
            }
            if (artifact.headers) {
                ant.zip(destfile: new File(dir, "${artifact.id}-${vendorVersion}-headers.zip")) {
                    zipfileset(dir: file('src/main/include')) {
                        include(name: 'base/**')
                        exclude(name: 'base/DriveTarget.h')
                        exclude(name: 'base/detail/**')
                    }
                }
            }
            if (artifact.sources) {
                ant.zip(destfile: new File(dir, "${artifact.id}-${vendorVersion}-sources.zip")) {
                    zipfileset(dir: file('src/main/cpp/base')) { include(name: '**/*.cpp') }
                    zipfileset(dir: file('src/main/cpp/modules')) { include(name: '**/*.cpp') }
                    zipfileset(dir: file('src/main/cpp/modules')) { include(name: '**/*.cppm') }
                }
            }
        }
        if (!missingArtifacts.isEmpty()) {
            throw new GradleException("Missing vendordep inputs; build all Linux, roboRIO, and Windows Debug/Release targets first:\n" +
                missingArtifacts.collect { " - ${it}" }.join('\n'))
        }
        exec {
            commandLine 'python3', file('scripts/finalize_vendordep.py').absolutePath, root.absolutePath
        }
    }
}

// Reproducible provenance travels with both live and replay output WPILOGs.
def provenanceHeader = layout.buildDirectory.file('generated/replay/BuildProvenance.h')
tasks.register('generateReplayProvenance') {
    outputs.file(provenanceHeader)
    outputs.upToDateWhen { false }
    doLast {
        def capture = { List<String> command ->
            def bytes = new ByteArrayOutputStream()
            exec { commandLine command; standardOutput = bytes }
            bytes.toString('UTF-8').trim()
        }
        def revision = capture(['git', 'rev-parse', 'HEAD'])
        def dirty = !capture(['git', 'status', '--porcelain']).isEmpty()
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        files(fileTree('src'), fileTree('vendordeps')).files.findAll { it.isFile() }.sort { a,b -> a.path <=> b.path }.each {
            digest.update(project.relativePath(it).getBytes('UTF-8'))
            digest.update(it.bytes)
        }
        digest.update(file('build.gradle').bytes)
        def header = provenanceHeader.get().asFile
        header.parentFile.mkdirs()
        header.text = "#pragma once\n#define FRC_BUILD_REVISION \"${revision}\"\n#define FRC_BUILD_DIRTY \"${dirty}\"\n#define FRC_BUILD_SOURCE_HASH \"${digest.digest().encodeHex()}\"\n"
    }
}
tasks.withType(CppCompile).configureEach {
    dependsOn tasks.named('generateReplayProvenance')
    includes.from(provenanceHeader.map { it.asFile.parentFile })
}

// GradleRIO's native C++ model does not scan named-module dependencies. Build
// the module interface from the target's generated compile command first, then
// make each importer use that target/configuration-specific BMI.
def driveTargetModuleName = 'meco.base.drive_target'
def driveTargetModuleTasks = [:]
def registerDriveTargetModule = { String platform, String variant ->
    def key = "${platform}-${variant}".replaceAll('[^A-Za-z0-9]+', '_')
    def capitalizedPlatform = platform.substring(0, 1).toUpperCase() + platform.substring(1)
    def mainCompileName = "compileFrcBase${capitalizedPlatform}${variant}StaticLibraryFrcBaseCpp"
    def compileCommandsName = "${mainCompileName}CompileCommands"
    def compileDatabase = layout.buildDirectory.file(
        "BinaryCompileCommands/${compileCommandsName}/compile_commands.json")
    def moduleDir = layout.buildDirectory.dir("named-modules/${platform}/${variant.toLowerCase()}")
    def interfaceFile = moduleDir.map { it.file(platform.startsWith('windows') ? 'meco.base.drive_target.ifc' : 'meco.base.drive_target.gcm') }
    def interfaceObject = moduleDir.map { it.file(platform.startsWith('windows') ? 'meco.base.drive_target.obj' : 'meco.base.drive_target.o') }
    def mapperFile = moduleDir.map { it.file('module-mapper.txt') }
    def moduleTask = tasks.register("compileDriveTargetModule_${key}") {
        dependsOn compileCommandsName
        inputs.file(compileDatabase)
        inputs.file(file('src/main/cpp/modules/DriveTarget.cppm'))
        outputs.files(interfaceFile, interfaceObject, mapperFile)
        doLast {
            def database = compileDatabase.get().asFile
            def entries = new groovy.json.JsonSlurper().parse(database)
            def entry = entries.find { it.file.toString().replace('\\', '/').endsWith('/src/main/cpp/base/drive/Drive.cpp') }
            if (entry == null || !(entry.arguments instanceof List)) {
                throw new GradleException("No argument-list compile command for Drive.cpp in ${database}")
            }

            def outputDir = moduleDir.get().asFile
            outputDir.mkdirs()
            def bmi = interfaceFile.get().asFile
            def object = interfaceObject.get().asFile
            def mapper = mapperFile.get().asFile
            def modulePdb = new File(outputDir, 'meco.base.drive_target.pdb')
            if (!platform.startsWith('windows')) {
                mapper.text = "${driveTargetModuleName} ${bmi.absolutePath}\n"
            }

            def command = []
            def sourcePath = entry.file.toString()
            def moduleSource = file('src/main/cpp/modules/DriveTarget.cppm').absolutePath
            def oldSource = false
            def args = entry.arguments.collect { it.toString() }
            for (int i = 0; i < args.size(); ++i) {
                def arg = args[i]
                if (arg == '/reference' || arg == '-fmodules-ts' || arg.startsWith('-fmodule-mapper=') ||
                    arg.startsWith('/ifcSearchDir') || arg == '/DMECO_USE_NAMED_MODULES=1' ||
                    arg == '-DMECO_USE_NAMED_MODULES=1') {
                    if (arg == '/reference') ++i
                    continue
                }
                if (arg.startsWith('/reference:')) continue
                if (arg.equalsIgnoreCase('/Fd') && i + 1 < args.size()) {
                    command << "/Fd${modulePdb.absolutePath}"
                    ++i
                } else if (arg.toLowerCase().startsWith('/fd')) {
                    command << "/Fd${modulePdb.absolutePath}"
                } else if (arg == '-o' && i + 1 < args.size()) {
                    if (platform.startsWith('windows')) {
                        command << "/Fo${object.absolutePath}"
                    } else {
                        command.addAll([arg, object.absolutePath])
                    }
                    ++i
                } else if (arg.equalsIgnoreCase('/Fo') && i + 1 < args.size()) {
                    command << "/Fo${object.absolutePath}"
                    ++i
                } else if (arg.toLowerCase().startsWith('/fo')) {
                    command << "/Fo${object.absolutePath}"
                } else if (arg == sourcePath || arg.replace('\\', '/') == sourcePath.replace('\\', '/')) {
                    command << moduleSource
                    oldSource = true
                } else {
                    command << arg
                }
            }
            if (!oldSource) throw new GradleException("Drive.cpp was not present in compile command ${database}")

            if (platform.startsWith('windows')) {
                command.addAll(['/interface', '/TP', '/ifcOutput', bmi.absolutePath])
            } else {
                command.addAll(['-fmodules-ts', "-fmodule-mapper=${mapper.absolutePath}"])
            }
            project.exec {
                workingDir entry.directory
                commandLine command
            }
        }
    }
    driveTargetModuleTasks[key] = [task: moduleTask, bmi: interfaceFile, object: interfaceObject,
                                   mapper: mapperFile]
}

['linuxathena', 'linuxx86-64', 'windowsx86-64'].each { platform ->
    ['Debug', 'Release'].each { variant -> registerDriveTargetModule(platform, variant) }
}
def driveTargetModuleBuild = { String platform, String variant ->
    driveTargetModuleTasks["${platform}-${variant}".replaceAll('[^A-Za-z0-9]+', '_')]
}

gradle.projectsEvaluated {
tasks.withType(org.gradle.nativeplatform.tasks.LinkExecutable).configureEach { task ->
    if (task.name.startsWith('linkMecoBaseTest') && task.name.toLowerCase().contains('linux')) {
        // Native model libraries are emitted before the project archive. Repeat
        // libraries after frcBase for GNU ld and --as-needed resolution.
        def projectArchive = file("build/libs/frcBase/static/${task.name.toLowerCase().contains('linuxathena') ? 'linuxathena' : 'linuxx86-64'}/${task.name.toLowerCase().contains('debug') ? 'debug' : 'release'}/libfrcBase.a").canonicalFile
        def trailingArchives = task.libs.elements.map { files ->
            files.collect { it.asFile }.findAll {
                (it.name.endsWith('.a') || it.name.endsWith('.so') || it.name.contains('.so.')) &&
                    it.canonicalFile != projectArchive
            }
                .collect { it.absolutePath }
        }
        task.linkerArgs.addAll(trailingArchives)
    }
}
tasks.withType(CppCompile).all { compileTask ->
    def loweredName = compileTask.name.toLowerCase()
    def platform = ['linuxathena', 'linuxx86-64', 'windowsx86-64'].find { loweredName.contains(it) }
    if (platform == null) return
    def variant = compileTask.name.toLowerCase().contains('debug') ? 'Debug' : 'Release'
    def moduleBuild = driveTargetModuleBuild(platform, variant)
    compileTask.dependsOn(moduleBuild.task)
}

// The interface object carries the module initializer required by GCC and is
// linked beside the module implementation for both the robot and its test binary.
tasks.configureEach { task ->
    if (task.name.startsWith('linkMecoBaseTest') && task.hasProperty('source')) {
        def loweredName = task.name.toLowerCase()
        def platform = ['linuxathena', 'linuxx86-64', 'windowsx86-64'].find { loweredName.contains(it) }
        if (platform == null) return
        def variant = task.name.toLowerCase().contains('debug') ? 'Debug' : 'Release'
        def moduleBuild = driveTargetModuleBuild(platform, variant)
        task.dependsOn(moduleBuild.task)
        task.source.from(moduleBuild.object)
    }
}
}
